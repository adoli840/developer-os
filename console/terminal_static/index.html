<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DeveloperOS Server Terminal</title>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css?v=5.5.0">
  <link rel="stylesheet" href="/terminal.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <div>
        <strong>Server Terminal</strong>
        <span>DeveloperOS</span>
      </div>
    </div>
    <div class="connection" id="connection-state">
      <span class="connection-dot" aria-hidden="true"></span>
      Connecting
    </div>
  </header>

  <main class="terminal-shell">
    <section class="context-bar" aria-label="Terminal context">
      <div class="project-tabs" id="project-tabs"></div>
      <div class="context-path" id="context-path">Connecting</div>
      <div class="terminal-actions" aria-label="Terminal actions">
        <button class="terminal-action" id="copy-button" type="button" title="Copy selection (Ctrl+Shift+C)">Copy</button>
        <button class="terminal-action" id="paste-button" type="button" title="Paste clipboard (Ctrl+Shift+V)">Paste</button>
        <button class="terminal-action" id="clear-button" type="button">Clear</button>
      </div>
    </section>

    <section class="terminal-viewport" id="terminal-viewport" aria-label="Interactive Linux terminal"></section>
  </main>

  <script src="/vendor/xterm/xterm.js?v=5.5.0"></script>
  <script src="/vendor/xterm/addon-fit.js?v=0.10.0"></script>
  <script src="/terminal.js?v=4"></script>
</body>
</html>
