<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeveloperOS Console</title>
  <link rel="stylesheet" href="/styles.css?v=3">
  <link rel="stylesheet" href="/roadmap-assets/roadmap-view.css?v=3.0.2">
</head>
<body>
  <section class="login-shell" id="login-shell" hidden>
    <form class="login-panel" id="login-form">
      <div class="brand-mark">D</div>
      <p class="eyebrow">WORKSPACE CONTROL</p>
      <h1>DeveloperOS</h1>
      <p class="muted">Enter the console access token.</p>
      <label for="access-token">Access token</label>
      <input id="access-token" name="token" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">Sign in</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
  </section>

  <div class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark small">D</span>
        <div>
          <strong>DeveloperOS</strong>
          <span>Engineering Console</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="mode-badge" id="mode-badge">Secure session</span>
        <span class="sync-state" id="sync-state">Waiting</span>
        <button class="button quiet" id="refresh-button" type="button">Refresh</button>
        <button class="button quiet" id="logout-button" type="button">Sign out</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Console sections">
      <button class="nav-item active" data-tab="projects" type="button">Projects</button>
      <button class="nav-item" data-tab="resources" type="button">Resources</button>
      <button class="nav-item" data-tab="roadmap" type="button">Roadmap</button>
      <button class="nav-item" data-tab="recovery" type="button">Recovery</button>
      <button class="nav-item" data-tab="usage" type="button">Usage</button>
    </aside>

    <main class="workspace">
      <section class="tab-view" id="tab-resources">
        <div class="metrics-grid" id="server-metrics"></div>
      </section>

      <section class="tab-view active" id="tab-projects">
        <div class="workstation-list" id="workstation-detail"></div>
      </section>

      <section class="tab-view" id="tab-recovery">
        <div class="section-heading">
          <div>
            <p class="eyebrow">RECOVERY EVIDENCE</p>
            <h1>Recovery</h1>
          </div>
        </div>
        <div class="two-column">
          <section class="surface" id="backup-summary"></section>
          <section class="surface" id="timer-summary"></section>
        </div>
      </section>

      <section class="tab-view" id="tab-roadmap" aria-label="Project roadmaps">
        <div class="roadmap-tabs" id="roadmap-tabs" role="tablist" aria-label="Project roadmaps"></div>
        <div class="roadmap-track-tabs" id="roadmap-track-tabs" role="tablist" aria-label="Roadmap tracks" hidden></div>
        <div class="roadmap-detail" id="roadmap-detail" role="tabpanel" aria-live="polite"></div>
      </section>

      <section class="tab-view" id="tab-usage">
        <div class="section-heading">
          <div>
            <p class="eyebrow">COST VISIBILITY</p>
            <h1>Usage</h1>
          </div>
        </div>
        <div class="usage-providers" id="usage-panel"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/roadmap-assets/roadmap-view.js?v=3.0.2" defer></script>
  <script src="/app.js?v=4" defer></script>
</body>
</html>
